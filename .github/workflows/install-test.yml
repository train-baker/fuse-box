# Fresh install on each OS with one Python: pip install, then start the real app in demo mode
# (fake Resolve) and check it is still running after a few seconds.
name: Install test

on:
  workflow_dispatch:
  push:
    paths: [requirements.txt, pyproject.toml, node_toggle.py, .github/workflows/install-test.yml]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux desktop libraries Qt needs (already on a normal desktop)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip list

      - name: Start in demo mode
        run: |
          run() {
            python node_toggle.py --demo > app.log 2>&1 &
            pid=$!
            sleep 12
            if kill -0 "$pid" 2>/dev/null; then
              echo "Still running after 12 s: OK"
              kill "$pid" || true
              status=0
            else
              wait "$pid"
              echo "Exited early with code $?"
              status=1
            fi
            echo "--- app output ---"
            cat app.log
            return $status
          }
          if [ "$RUNNER_OS" = Linux ]; then  # a virtual screen for Qt and pynput
            Xvfb :99 -screen 0 1920x1080x24 &
            export DISPLAY=:99
            sleep 2
          fi
          run

      - name: Imports used at runtime
        run: |
          if [ "$RUNNER_OS" = Linux ]; then wrap="xvfb-run -a"; else wrap=""; fi
          $wrap python -c "import PySide6, zstandard; from pynput import keyboard; print('PySide6', PySide6.__version__, '| pynput keyboard backend', keyboard.Listener.__module__)"
