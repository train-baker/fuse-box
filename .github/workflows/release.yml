# Build Fuse Box as a stand-alone app (PyInstaller, Python 3.12) on Windows, macOS and Linux, check each
# build starts (demo mode), and attach them to a GitHub release when a version tag (v*) is pushed.
# macOS gets a .dmg installer: open it and drag Fuse Box onto Applications.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            backend: pynput.keyboard._win32
          - os: macos-latest
            platform: macos-arm64
            backend: pynput.keyboard._darwin
          - os: ubuntu-latest
            platform: linux-x64
            backend: pynput.keyboard._xorg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux desktop libraries Qt needs (for the start check)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version=dev
          sep=":"; [ "$RUNNER_OS" = Windows ] && sep=";"  # --add-data's separator
          common=(--noconfirm --hidden-import mock_resolve --hidden-import ${{ matrix.backend }}
                  --hidden-import importlib.machinery --hidden-import importlib.util
                  --add-data "fonts${sep}fonts" --add-data "assets${sep}assets")  # Inter, the alert sign
          mkdir -p out
          case "$RUNNER_OS" in
            Windows)
              python -m PyInstaller "${common[@]}" --onefile --windowed --name FuseBox fuse_box.py
              cp dist/FuseBox.exe "out/FuseBox-$version-${{ matrix.platform }}.exe"
              echo "APP=dist/FuseBox.exe" >> "$GITHUB_ENV" ;;
            macOS)
              python -m PyInstaller "${common[@]}" --windowed --name "Fuse Box" \
                --osx-bundle-identifier com.fusebox.app fuse_box.py
              # the installer: a disk image with the app and an Applications shortcut to drag it onto
              mkdir dmg
              cp -R "dist/Fuse Box.app" dmg/
              ln -s /Applications dmg/Applications
              hdiutil create -volname "Fuse Box" -srcfolder dmg -ov -format UDZO \
                "out/FuseBox-$version-${{ matrix.platform }}.dmg"
              echo "APP=dist/Fuse Box.app/Contents/MacOS/Fuse Box" >> "$GITHUB_ENV" ;;
            Linux)
              python -m PyInstaller "${common[@]}" --onefile --name fusebox fuse_box.py
              tar -czf "out/FuseBox-$version-${{ matrix.platform }}.tar.gz" -C dist fusebox
              echo "APP=dist/fusebox" >> "$GITHUB_ENV" ;;
          esac
          ls -la out

      - name: Check the build starts (demo mode)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then  # a virtual screen for Qt and pynput
            Xvfb :99 -screen 0 1920x1080x24 &
            export DISPLAY=:99
            sleep 2
          fi
          "$APP" --demo > app.log 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 15 s: OK"
            kill "$pid" || true
            status=0
          else
            wait "$pid"
            echo "Exited early with code $?"
            status=1
          fi
          echo "--- app output ---"
          cat app.log
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Fuse Box ${{ github.ref_name }}
          prerelease: true
          files: out/*
          body: |
            Stand-alone builds of Fuse Box (no Python needed), built with Python 3.12.

            - **macOS** (Apple silicon): open `FuseBox-…-macos-arm64.dmg` and drag **Fuse Box** onto **Applications**. The first time, right-click Fuse Box in Applications → Open (it isn't signed or notarised). Global hotkeys need System Settings → Privacy & Security → Accessibility (and Input Monitoring) for Fuse Box.
            - **Windows**: `FuseBox-…-windows-x64.exe`. SmartScreen may warn about an unknown publisher (the app isn't signed): More info → Run anyway.
            - **Linux** (x64): `tar -xzf FuseBox-…-linux-x64.tar.gz`, then `./fusebox`. Hotkeys need an X11 session.

            DaVinci Resolve must have external scripting set to **Local** (Preferences → System → General). In Fuse Box, tick **Script Shortcut** to open it from Resolve's Workspace › Scripts menu.
