# Build Fuse Box as a stand-alone app (PyInstaller, Python 3.12) on Windows, macOS and Linux, check each
# build starts (demo mode), and attach them to a GitHub release when a version tag (v*) is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            backend: pynput.keyboard._win32
          - os: macos-latest
            platform: macos-arm64
            backend: pynput.keyboard._darwin
          - os: ubuntu-latest
            platform: linux-x64
            backend: pynput.keyboard._xorg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux desktop libraries Qt needs (for the start check)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version=dev
          common=(--noconfirm --hidden-import mock_resolve --hidden-import ${{ matrix.backend }}
                  --hidden-import importlib.machinery --hidden-import importlib.util)
          mkdir -p out
          case "$RUNNER_OS" in
            Windows)
              python -m PyInstaller "${common[@]}" --onefile --windowed --name FuseBox node_toggle.py
              cp dist/FuseBox.exe "out/FuseBox-$version-${{ matrix.platform }}.exe"
              echo "APP=dist/FuseBox.exe" >> "$GITHUB_ENV" ;;
            macOS)
              python -m PyInstaller "${common[@]}" --windowed --name "Fuse Box" \
                --osx-bundle-identifier com.fusebox.app node_toggle.py
              ditto -c -k --keepParent "dist/Fuse Box.app" "out/FuseBox-$version-${{ matrix.platform }}.zip"
              echo "APP=dist/Fuse Box.app/Contents/MacOS/Fuse Box" >> "$GITHUB_ENV" ;;
            Linux)
              python -m PyInstaller "${common[@]}" --onefile --name fusebox node_toggle.py
              tar -czf "out/FuseBox-$version-${{ matrix.platform }}.tar.gz" -C dist fusebox
              echo "APP=dist/fusebox" >> "$GITHUB_ENV" ;;
          esac
          ls -la out

      - name: Check the build starts (demo mode)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then  # a virtual screen for Qt and pynput
            Xvfb :99 -screen 0 1920x1080x24 &
            export DISPLAY=:99
            sleep 2
          fi
          "$APP" --demo > app.log 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 15 s: OK"
            kill "$pid" || true
            status=0
          else
            wait "$pid"
            echo "Exited early with code $?"
            status=1
          fi
          echo "--- app output ---"
          cat app.log
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Fuse Box ${{ github.ref_name }}
          prerelease: true
          files: out/*
          body: |
            Stand-alone builds of Fuse Box (no Python needed), built with Python 3.12.

            - **Windows**: `FuseBox-…-windows-x64.exe`. Windows SmartScreen may warn about an unknown publisher (the app isn't signed): More info → Run anyway.
            - **macOS** (Apple silicon): unzip, then right-click **Fuse Box.app** → Open the first time (not signed or notarised). Global hotkeys need System Settings → Privacy & Security → Accessibility.
            - **Linux** (x64): `tar -xzf FuseBox-…-linux-x64.tar.gz`, then `./fusebox`. Hotkeys need an X11 session.

            DaVinci Resolve must have external scripting set to **Local** (Preferences → System → General).
